# Runs the stack behind a reverse proxy that already exists on the host, rather
# than the bundled Caddy. The app is published on loopback only and nothing
# here binds 80 or 443, so other sites on the box are untouched.
#
#   docker compose up -d --build     # postgres, migrate, discord, app, worker
#
# To use the bundled Caddy instead, on a host with 80 and 443 free:
#
#   docker compose --profile edge up -d --build

services:
  # Behind a profile so a plain `up` can never grab 80 and 443.
  caddy:
    profiles: ["edge"]

  app:
    ports:
      # Loopback only. Docker's iptables rules bypass UFW, so a bare "6500:3000"
      # here would be open to the internet whatever the firewall says.
      - "127.0.0.1:6500:3000"
